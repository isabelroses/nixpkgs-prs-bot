[package]
name = "nixpkgs-prs"
version = "0.5.2"
license = "EUPL-1.2"
description = "check the merged nixpkgs PRs for that day"
readme = "README.md"
homepage = "https://github.com/isabelroses/nixpkgs-prs-bot"
repository = "https://github.com/isabelroses/nixpkgs-prs-bot"
authors = ["isabel roses <isabel@isabelroses.com>"]
edition = "2024"
keywords = ["cli", "nix", "nixpkgs", "nixpkgs-prs"]

[dependencies]
reqwest = { version = "0.13.2", features = ["json", "multipart"] }
chrono = { version = "0.4.43", default-features = false, features = ["now"] }
clap = { version = "4.5.59", features = ["derive"] }
tokio = { version = "1.49.0", default-features = false, features = [
  "rt-multi-thread",
  "macros",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
regex = "1.12.3"
megalodon = { version = "1.1.3", optional = true }
bsky-sdk = { version = "0.1.23", default-features = false, features = [
  "default-client",
], optional = true }
ipld-core = { version = "0.4.3", optional = true }

[features]
default = ["post-bsky", "post-fedi"]
post-bsky = ["dep:bsky-sdk", "dep:ipld-core"]
post-fedi = ["dep:megalodon"]

[lints.clippy]
all = "warn"
pedantic = "warn"
